import = [
    "~/.config/alacritty/themes/catpuccin_mocha.toml"
]

live_config_reload = true
[shell]
program = "/usr/bin/zsh"
[env]
TERM = "xterm-256color"
[window]
opacity = 0.97
dynamic_padding = true
decorations="None"
padding = {x = 5, y = 5}

[font]
size = 8.5
offset.y = 2

[font.bold]
family = "FiraCode Nerd Font"
style = "Heavy"

[font.bold_italic]
family = "FiraCode Nerd Font"
style = "Heavy Italic"

[font.italic]
family = "FiraCode Nerd Font"
style = "Medium Italic"

[font.normal]
family = "FiraCode Nerd Font"
style = "Medium"
