bg {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    color = rgba(20, 20, 22, 1.0)
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true

    font_color = rgb(208, 208, 213)
    inner_color = rgb(20, 20, 22)
    outer_color = rgb(58, 58, 66)
    check_color = rgb(208, 135, 112)
    fail_color = rgb(230, 57, 70)

    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font

    position = 0, -50
    halign = center
    valign = center
}

# Clock - Hours
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgb(255, 77, 77)
    font_size = 120
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 190
    halign = center
    valign = center
}

# Clock - Minutes
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgb(208, 208, 213)
    font_size = 120
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 50
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgb(184, 184, 192)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -100
    halign = center
    valign = center
}
